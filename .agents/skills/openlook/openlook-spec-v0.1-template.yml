id: "homepage-first-impression"
name: "Homepage First Impression"
description: "A small visual unit test for a single page and user intent."

target:
  url: "http://localhost:5173"
  viewport:
    width: 1440
    height: 900

persona:
  role: "developer"
  context: "Visiting the product for the first time and deciding whether it is worth trying."

task:
  goal: "Understand what the product does and decide what to do next."
  steps:
    - "Open the target page."
    - "Look at the first viewport."
    - "Scroll once to understand the workflow or supporting proof."

checks:
  - id: "value-prop-clear"
    question: "Can the user understand the product value from the first viewport?"
    pass: "The hero clearly explains the product, who it is for, and why it matters."
    fail: "The hero is vague, generic, hidden, or does not explain the product value."

  - id: "primary-action-clear"
    question: "Is the next action visually obvious?"
    pass: "There is one visually dominant primary action near the hero."
    fail: "There are competing actions, weak contrast, or no clear next step."

  - id: "design-polished"
    question: "Does the page feel polished and product-led?"
    pass: "The page uses a clean visual system, restrained typography, strong spacing, and concrete product artifacts."
    fail: "The page feels unfinished, cluttered, generic, or visually inconsistent."

verdict:
  pass_if: "all checks pass"
