id: homepage-first-impression
url: http://localhost:3000

steps:
  - Open the homepage
  - Observe the first viewport without scrolling
  - Scroll through the entire page slowly for supporting context

checks:
  - id: headline-clear
    question: Does the first viewport explain the product clearly?
    pass: The main headline and supporting copy make the value understandable without extra context.
    fail: The first viewport is vague, confusing, or does not explain the value.

  - id: primary-action-visible
    question: Is there a clear primary next action?
    pass: A single primary call to action is easy to find and visually distinct.
    fail: The next action is missing, buried, or visually weak.

  - id: page-not-overwhelming
    question: Is the page visually scannable and not overwhelming?
    pass: The page uses clear hierarchy, enough spacing, and a manageable amount of information.
    fail: The page feels crowded, noisy, or hard to scan.
