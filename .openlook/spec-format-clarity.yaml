id: spec-format-clarity
url: http://localhost:3000/#spec

viewport:
  width: 1440
  height: 900

steps:
  - Navigate to http://localhost:3000/#spec
  - Scroll down below the "Spec format" code snippet to observe the supporting fields grid
  - Verify that the four field names ("id", "url", "steps", and "checks") are clearly visible and legible

checks:
  - id: field-labels-visible
    question: In the columns of the tabular grid located directly below the syntax-highlighted code block, are the headers ("id", "url", "steps", "checks") clearly visible as high-contrast white text?
    pass: The four header labels "id", "url", "steps", and "checks" are rendered in bright high-contrast white text directly above their description boxes in the lower grid table.
    fail: The header labels are completely black, invisible, or missing, leaving only the descriptions floating without titles.

  - id: grid-layout-spaced
    question: In that lower tabular grid, are the columns generous in width with clear horizontal spacing?
    pass: The columns have a wide, distinct horizontal layout (e.g. gap-6) with readable separation.
    fail: The columns are completely squished, overlapping, or close together due to layout errors.

